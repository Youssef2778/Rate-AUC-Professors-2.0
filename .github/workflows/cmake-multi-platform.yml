name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu with GCC
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          
          # Ubuntu with Clang
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
          
          # Windows with MSVC
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # ============================================================================
    # WINDOWS DEPENDENCIES
    # ============================================================================
    - name: Install Boost and MySQL via vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # vcpkg is pre-installed on GitHub Actions Windows runners at C:\vcpkg
        vcpkg install boost-json:x64-windows
        vcpkg install boost-asio:x64-windows
        vcpkg install mysql-connector-cpp[jdbc]:x64-windows

    - name: Build and install libbcrypt from source (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        git clone https://github.com/trusch/libbcrypt
        cd libbcrypt
        mkdir build
        cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=C:\libbcrypt -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && ^
        cmake --build . --config Release && ^
        cmake --install . --config Release
        echo CMAKE_PREFIX_PATH=C:\libbcrypt>> "%GITHUB_ENV%"

    # ============================================================================
    # UBUNTU DEPENDENCIES
    # ============================================================================
    - name: Install dependencies on Ubuntu
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          libboost-all-dev \
          mysql-server \
          libmysqlcppconn-dev \
          libssl-dev

    - name: Build and install libbcrypt from source (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        git clone https://github.com/trusch/libbcrypt
        cd libbcrypt
        mkdir build
        cd build
        cmake ..
        make
        sudo make install
        sudo ldconfig

    # ============================================================================
    # INSTALL QT VIA ACTION (Cross-platform)
    # ============================================================================
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        modules: 'qt5compat'
        cache: true
        
    # ============================================================================
    # CONFIGURE CMAKE
    # ============================================================================
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-windows
        -S ${{ github.workspace }}

    - name: Configure CMake (Ubuntu)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    # ============================================================================
    # BUILD
    # ============================================================================
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    # ============================================================================
    # TEST
    # ============================================================================
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
